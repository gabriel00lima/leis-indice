name: Sonda STJ (temporária)
on:
  push:
    branches: [claude/project-thread-durrw4]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node .sonda/sonda.mjs
      - run: curl -sS -L -o /dev/null -w "%{http_code} %{url_effective}\n" "https://processo.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203143240" || true
