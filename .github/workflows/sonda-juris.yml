name: Sonda juris (temporária)
on:
  push:
    branches: [claude/project-thread-5fds8b]
    paths: [".github/workflows/sonda-juris.yml", "sonda.py"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python sonda.py
