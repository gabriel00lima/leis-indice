name: Monitor de mudanças

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 (horário de Brasília)
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write   # salvar monitor/estado.json
  issues: write     # abrir uma issue por lei alterada

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r monitor/requirements.txt

      - name: Verificar leis acompanhadas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}    # opcional
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # opcional
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}      # opcional
        run: python monitor/monitor.py

      - name: Salvar estado
        if: always()
        run: |
          git add monitor/estado.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "monitor: atualiza estado"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
